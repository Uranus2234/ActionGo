name: generic_humanoid_gpt
runtime:
  template: motion_conditioned_tracking
  variant: humanoid_gpt
  inference_hz: 50
  publish_hz: 500
  onnx_threads: 2
  target_interp_sec: 0.0
  stats_interval: 50
  dry_run_duration_sec: 1.0
robot:
  params: HumanoidGPT.yaml
  motor_count: 29
model:
  path: ../model/pns_wo_priv216.onnx
  input_names:
    - obs
  output_names:
    - continuous_actions
  obs_input: obs
  action_output: continuous_actions
observation:
  obs_dim: 136
reference:
  source: offline-npz
  path: ../motions/human_walking_50Hz_29dof.npz
  qpos_dim: 36
  qvel_dim: 35
  keypoint_count: 14
  hmcp_header_size: 20
  loop: false
  realtime_transport: udp
  udp_bind: 0.0.0.0
  udp_port: 51234
  require_realtime: false
  input_timeout_sec: 3.0
  stale_sec: 0.25
  stale_behavior: hold_then_stop
  convert_xml_path: ../assets/g1_mjx_track_meshless.xml
action:
  type: target_q
  action_dim: 29
  source_output: continuous_actions
  semantic: default_q_plus_raw_action_times_policy_action_scale
handoff:
  cmd_topic: rt/user_lowcmd
  state_topic: rt/lowstate
  mode_machine: 5
  activation_blend_sec: 0.10
  damping_on_stop: false
safety:
  enabled: true
  finite_check: true
  joint_limit_enabled: true
  lowstate_timeout_enabled: true
  lowstate_timeout_sec: 0.2
  kp_max: 300.0
  kd_max: 20.0
