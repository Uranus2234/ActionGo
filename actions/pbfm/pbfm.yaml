actions:
  generic_policy:
    pbfm_pico_teleop:
      safety_enable: true
      params: config/generic_pbfm_pico.yaml
      prestart_before_userctrl: true
      prestart_ready_timeout_sec: 40.0
      switch_back: true
      switch_back_mode: walkrun
      command: "{action_go_root}/build/generic_sensor_policy_player --net {net} --cmd-topic rt/user_lowcmd --state-topic rt/lowstate --spec {params} --ready-file {ready_file} --start-file {start_file} --no-damping-on-stop {event_log_arg}"
    pbfm_loco:
      safety_enable: true
      params: config/generic_pbfm_loco.yaml
      prestart_before_userctrl: true
      prestart_ready_timeout_sec: 15.0
      switch_back: true
      switch_back_mode: walkrun
      command: "{action_go_root}/build/generic_sensor_policy_player --net {net} --cmd-topic rt/user_lowcmd --state-topic rt/lowstate --spec {params} --ready-file {ready_file} --start-file {start_file} --no-damping-on-stop {event_log_arg}"
    pbfm_tracking_dance:
      safety_enable: true
      params: config/generic_pbfm_tracking_dance.yaml
      prestart_before_userctrl: true
      prestart_ready_timeout_sec: 15.0
      postrun_handoff_hold: true
      switch_back_overlap_sec: 0.30
      switch_back: true
      switch_back_mode: walkrun
      command: "{action_go_root}/build/generic_sensor_policy_player --net {net} --cmd-topic rt/user_lowcmd --state-topic rt/lowstate --spec {params} --ready-file {ready_file} --start-file {start_file} --handoff-complete-file {handoff_complete_file} --handoff-release-file {handoff_release_file} --no-damping-on-stop {event_log_arg}"
    pbfm_joystick:
      safety_enable: true
      params: config/generic_pbfm_joystick.yaml
      prestart_before_userctrl: true
      prestart_ready_timeout_sec: 10.0
      switch_back: true
      switch_back_mode: walkrun
      command: "{action_go_root}/build/generic_sensor_policy_player --net {net} --cmd-topic rt/user_lowcmd --state-topic rt/lowstate --spec {params} --ready-file {ready_file} --start-file {start_file} --no-damping-on-stop {event_log_arg}"
    pbfm_arms_up:
      safety_enable: true
      params: config/generic_pbfm.yaml
      prestart_before_userctrl: true
      prestart_ready_timeout_sec: 10.0
      switch_back: true
      switch_back_mode: walkrun
      command: "{action_go_root}/build/generic_sensor_policy_player --net {net} --cmd-topic rt/user_lowcmd --state-topic rt/lowstate --spec {params} --ready-file {ready_file} --start-file {start_file} --no-damping-on-stop {event_log_arg}"
