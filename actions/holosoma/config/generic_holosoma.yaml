# ActionGo Generic Policy Runtime V1 spec.
# Template: Embedded-Mimic Time Policies (obs + time_step -> actions + internal reference outputs)
name: generic_holosoma_dance
runtime:
  template: embedded_mimic_time
  variant: holosoma
  inference_hz: 50
  publish_hz: 500
  onnx_threads: 2
  target_interp_sec: 0.02
  stats_interval: 50
  dry_run_duration_sec: 1.0
robot:
  params: HolosomaWBT.yaml
  motor_count: 29
model:
  path: ../model/ppo_g1_29dof_dancing.onnx
  input_names: [obs, time_step]
  output_names: [actions, joint_pos, joint_vel, ref_quat_xyzw]
  obs_input: obs
observation:
  builder: holosoma
  obs_dim: 154
  terms: [last_policy_action, gyro, dof_pos, dof_vel, motion_joint_pos, motion_joint_vel, motion_ref_ori_3x2]
mimic_time:
  time_input_name: time_step
  time_step_source: wall_time
  internal_reference_outputs: [joint_pos, joint_vel, ref_quat_xyzw]
  motion_start_step: 0
  motion_end_step: 1020
  max_frames: 1020
  prepare_target: motion
  prepare_ramp_sec: 0.1
  prepare_hold_sec: 0.0
  policy_warmup_sec: 0.05
  yaw_alignment: torso_yaw_offset
  wall_time_timestep: true
  tracking_protection: true
  max_target_jump: 1.2
action:
  type: target_q
  action_dim: 29
  scale_from_params: action_scale
  add_default: true
  joint_clip: true
  target_interp_sec: 0.02
handoff:
  cmd_topic: rt/user_lowcmd
  state_topic: rt/lowstate
  mode_machine: 5
  damping_on_stop: false
safety: {}
