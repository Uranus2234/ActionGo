name: fighting154k_supermimic_omni_wbst_motive
runtime:
  template: motion_conditioned_tracking
  variant: supermimic
  inference_hz: 50
  publish_hz: 500
  onnx_threads: 2
  stats_interval: 50
  dry_run_duration_sec: 1.0
robot:
  params: SuperMimic.yaml
  motor_count: 29
model:
  path: ../model/supermimic_omni.onnx
  input_names:
  - obs
  output_names:
  - actions
  obs_input: obs
  action_output: actions
reference:
  type: supermimic_csv_v1
  path: ../motions/supermimic_wbst_motive.csv
  goal_frames: 10
  goal_dim: 730
  end_behavior: stop
  yaw_alignment: initial
  policy_step_source: wall_clock
observation:
  builder: supermimic
  obs_dim: 1720
  obs_frame_dim: 99
  history_len: 10
action:
  type: target_q
  action_dim: 29
  add_default: true
  scale_from_params: action_scale
handoff:
  cmd_topic: rt/user_lowcmd
  state_topic: rt/lowstate
  mode_machine: 5
  activation_blend_sec: 0.1
  damping_on_stop: false
safety:
  preserve_pd_torque: true
