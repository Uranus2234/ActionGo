actions:
  generic_policy:
    ufo_duobox_050_ma_trial:
      params: config/generic_ufo_duobox_050_ma.yaml
      safety_enable: true
      switch_back: true
      switch_back_mode: walkrun
      prestart_before_userctrl: true
      prestart_ready_timeout_sec: 30.0
      postrun_handoff_hold: true
      switch_back_overlap_sec: 0.30
      command: "{action_go_root}/build/generic_policy_player --net {net} --cmd-topic rt/user_lowcmd --state-topic rt/lowstate --spec {params} --ready-file {ready_file} --start-file {start_file} --handoff-complete-file {handoff_complete_file} --handoff-release-file {handoff_release_file} --no-damping-on-stop {event_log_arg}"
