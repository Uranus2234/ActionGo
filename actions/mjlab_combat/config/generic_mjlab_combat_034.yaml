name: mjlab_combat_92000_duobox034_ma
runtime:
  template: motion_conditioned_tracking
  variant: mjlab_combat
  inference_hz: 50
  publish_hz: 500
  onnx_threads: 2
robot:
  params: MjlabCombat.yaml
  motor_count: 29
model:
  path: ../model/policy_92000.onnx
  input_names: [obs]
  output_names: [actions]
  obs_input: obs
  action_output: actions
reference:
  type: mjlab_combat_csv_v1
  path: ../motions/duobox_034_ma.csv
  yaw_alignment: none
  end_behavior: stop
  policy_step_source: wall_clock
observation:
  builder: mjlab_combat
  obs_dim: 261
action:
  type: target_q
  action_dim: 29
  add_default: true
  scale_from_params: action_scale
handoff:
  cmd_topic: rt/user_lowcmd
  state_topic: rt/lowstate
  mode_machine: 5
  activation_blend_sec: 0.10
  damping_on_stop: false
