# 官方遥控器组合键到 action_go 动作名的映射。
# 按键名支持：R1 L1 Start Select R2 L2 F1 F2 A B X Y Up Right Down Left
# 组合键用 + 连接，例如 F1+A。

bindings:
  R1+Y: fighting154k_supermimic_omni_051_ma
  R1+A: fighting154k_supermimic_omni_wbst_motive
  R1+X: fighting154k_allmimic_omni_051_ma
  R1+B: fighting154k_allmimic_no_omni_051_ma
  R1+Up: fighting154k_supermimic_omni_side_kick
  R1+Down: fighting154k_supermimic_omni_yewendun
  R1+Left: fighting154k_allmimic_omni_side_kick
  R1+Right: fighting154k_allmimic_no_omni_side_kick
  R2+Down: kick_right
  Left+X: hlqk
  Left+A: ufo_tracking_zs7
  Left+Y: dance1_subject2_mjlab
  F1+A: wbst
  Up+X: reverse_vault_flat_mjlab
  Up+A: reverse_vault_terrain_mjlab
  Up+Y: g1_parkour
  Up+B: php_locomotion
  Down+A: pbfm_loco
  Down+B: pbfm_tracking_dance
  Down+X: pbfm_pico_teleop
  Right+A: allmimic_paoxiao
  Right+B: allmimic_paoxiao_no_omni
  Right+X: proto_walk
  Right+Y: proto_dance
  R1+F1: holosoma_dance
  F1+X: omni_seg04_wbst_stand
  F1+Y: omni_seg12_wbst_motive
  F1+B: omni_seg11_side_flip_roll
  # TWIST: offline pkl sample and realtime teleop.
  L1+Right: twist_offline_pkl
  L2+Right: twist_nokov_realtime   # UDP; 可改成 twist_zmq_realtime / twist_redis_realtime
  # SONIC: F2+X 离线 squat；F2+Y 连接原版 GEAR-SONIC PICO pose streamer。
  F2+X: sonic_offline_squat
  F2+Y: sonic_pico_teleop
  # GentleHumanoid 可选绑定示例；需要时取消注释。
  # F1+Right: gentle_walk

# 外壳模式：
# 启动 action_go_remote_test 后默认只监听遥控器，不启用动作/safety，不接管机器人。
# Start/Left+B 启用动作与 IMU safety；IMU 有效且倾角不低于 recover_angle_deg 时立即运行所选 stand recovery，否则仅 enable。
# Select+Start 立即切官方阻尼并回到外壳态，程序保持运行。
# R2+A 无论当前是否在跑模型，都会停止当前模型、切回官方 walkrun，并回到外壳/睡眠态。
shell_start: Start
shell_start_alt: Left+B
shell_start_action: bfm_zero_stand
shell_start_alt_action: ufo_stand
shell_damping: Select+Start
shell_walkrun: R2+A

# BeyondMimic 躺倒：L2+Down 执行，动作结束后回官方阻尼并回到外壳态。
lie_down: L2+Down
lie_action: lie_down_beyondmimic

# 常规遥控工作流保留 Select+Start / R2+A 作为停止/回外壳态按键；
# 下面这些低层退出/急停组合默认禁用，避免误触。
emergency: disabled

normal_exit: disabled

damping_exit: disabled


# RoboJuDo-style IMU safety：超过 fall_angle_deg 后自动阻尼；自动 recovery 默认关闭。
# Start/Left+B 在倾角不低于 recover_angle_deg 时启动对应 stand，低于该阈值只 enable；人工 recovery 不受 fall_angle_deg 上限限制。
# BFM/UFO recovery 运行期间不参与 fall_angle safety；仅在稳定低于 recover_angle_deg
# 达 recover_hold_ms 后自动切回 walkrun，player 失败时则阻尼并停止重试。
safety_enable: true
safety_auto_recovery: false
safety_action: bfm_zero_stand
safety_return_mode: walkrun
fall_angle_deg: 57.3      # RoboJuDo 原始阈值 1.0 rad ≈ 57.3°
recover_angle_deg: 30.0
fall_hold_ms: 60
recover_hold_ms: 1200
safety_cooldown_ms: 1000
