# ActionGo Generic Policy Runtime V1 spec.
# Template: Single-Actor State Policies (obs -> action)
name: generic_unitree_rl_mjlab_walkrun
runtime:
  template: single_actor_state
  variant: unitree_rl_mjlab
  inference_hz: 50
  publish_hz: 500
  onnx_threads: 1
  startup_sec: 0.2
  target_interp_sec: 0.02
  command_source: remote
  stats_interval: 100
  dry_run_duration_sec: 1.0
robot:
  params: ../params/env.yaml
  motor_count: 29
model:
  path: ../model/policy.onnx
  input_names: [obs]
  output_names: [actions]
  obs_input: obs
  action_output: actions
observation:
  builder: unitree_rl_mjlab
  obs_dim: 98
  base_obs_dim: 96
  allowed_obs_dims: [96, 97, 98]
  terms: [gyro, projected_gravity, command, optional_phase, q_minus_default, dq, last_action, optional_tail_scalar]
action:
  type: target_q
  action_dim: 29
  scale_from_params: actions.joint_pos.scale
  add_default: true
  max_action_abs: 5.0
  clip_by_torque: true
  target_interp_sec: 0.02
handoff:
  cmd_topic: rt/user_lowcmd
  state_topic: rt/lowstate
  mode_machine: 5
  activation_blend_sec: 0.10
  damping_on_stop: false
safety: {}
