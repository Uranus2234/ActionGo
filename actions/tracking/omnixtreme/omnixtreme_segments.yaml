# OmniXtreme split motion segments using the renamed .npz files.
#
# Canonical action names follow the renamed data fragments:
#   omni_segNN_<file-stem-without-number>
# Compatibility aliases with original frame ranges are kept below.
# max_frames is motion_frames - 1 because the player consumes frame+1 as ref.
actions:
  omnixtreme:
    # Default OmniXtreme segment for real-robot remote binding.
    omni_motion_default:
      safety_enable: false
      max_frames: 465
      switch_back: true
      switch_back_mode: walkrun
      model: actions/tracking/omnixtreme/model/base_policy_trt.onnx
      params: config/generic_omnixtreme.yaml
      trajectory: motions/segments/4_wbst_stand.npz

    # Canonical renamed segment actions.
